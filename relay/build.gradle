apply plugin: 'java'

jar {
    archiveFileName = 'relay-server.jar' // Specify the output JAR file name
    destinationDirectory.set(file("${project.rootDir}/build")) // Output directory

    manifest {
        attributes(
                'Main-Class': 'at.vunfer.openrealms.relay.MainServer' // Change this to your main class
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
